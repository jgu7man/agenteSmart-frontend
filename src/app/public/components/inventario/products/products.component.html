<mat-drawer-container [hasBackdrop]="false">
	<mat-drawer #currentProduct [mode]="'over'" [position]="'end'">
		<gdev-edit-product *ngIf="prodSelected" [product]="prodSelected" (closeForm)="onClosePanel()" ></gdev-edit-product>
	</mat-drawer>
	<mat-drawer-content>
		

		<div class="container" id="products">
			<div class="row" id="productTab">

				<div class="col s12">
					<mat-card class="dashboard-section-card">
						<mat-card-header class="dashboard-section-header">
							<mat-card-title class="dashboard-section-title">
								<h2>PRODUCTOS</h2>
								<button
								mat-raised-button
								[color]="'primary'" 
								[routerLink]="['../products/add']" 
								>Agregar</button>
							</mat-card-title>
							<mat-card-subtitle>
								Los productos que agregues a tu inventario podrán ser usados por el agente para que realices ventas.
							</mat-card-subtitle>
						</mat-card-header>
						<mat-card-content>

							<ng-container *ngIf="products && products.length > 0; else empty">
								<gdev-index-caller
							style="padding: 1em;"
							></gdev-index-caller>

							<mat-selection-list #listPanel [multiple]="false"
							(selectionChange)="onProdSelected($event)">
								<mat-list-option style="width: 100%;" [disabled]="true">
									<div class="row table-headers" style="width: 110%;">
										<div class="col s2">Imagen</div>
										<div class="col s4">Referencia</div>
										<div class="col s3">Sinónimos</div>
										<div class="col s1">Disp.</div>
									</div>
								</mat-list-option>
								<mat-list-option *ngFor="let product of products" [value]="product">
									<div class="row align-cols table-body" style="width: 100%;">
										<div class="col s2 prodImg">
											<img [src]="product.imagenUrl['url']" [alt]="product.referencia">
										</div>
										<div class="col s4">
											{{product.referencia}}
										</div>
										<div class="col s3">
											<span *ngFor="let sinonimos of product.sinonimos; index as i">
												{{sinonimos}}<span *ngIf="i != product.sinonimos.length -1">, </span>
											</span>
										</div>
										<div class="col s1 ">
											<ng-container *ngIf="product.onStock || product.stockCant; else outStock">
												<ng-container *ngIf="product.stockCant; else disp">
													{{product.stockCant}}													
												</ng-container>
												<ng-template #disp>
													<i class="fas fa-circle blue-text"></i>
												</ng-template>
											</ng-container>
											<ng-template #outStock>
												<i class="fas fa-circle grey-text"></i>
											</ng-template>
										</div>
									</div>
								</mat-list-option>
							</mat-selection-list>
							</ng-container>
							<ng-template #empty>
								<div class="col s12 center">
                                    <p class="center grey-text">Aún no tienes productos agregados</p>
                                    <i class="fas fa-robot fa-10x grey-text "></i>
                                </div>
							</ng-template>
							
						</mat-card-content>
					</mat-card>
					
				</div>
			</div>
		</div>
	
	</mat-drawer-content>
</mat-drawer-container>
