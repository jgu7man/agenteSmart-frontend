<mat-card class="mat-elevation-z5">
    <mat-card-header>
        <mat-card-title>{{contenido.title}}</mat-card-title>
    </mat-card-header>
    <img *ngIf="contenido.imageUri" [src]="contenido.imageUri" matCardImage>
    <mat-card-content>
        {{contenido.body}}
    </mat-card-content>
    <mat-card-actions>
        
    </mat-card-actions>
</mat-card>
