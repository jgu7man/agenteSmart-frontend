<h4 mat-dialog-title>
    {{tarjeta.name}}
</h4>

<mat-dialog-content>
    
    

    
            <aSmart-estatica-tarjeta 
            [contenido]="tarjeta.contenido"
            (edited)="updateTarjeta($event)"
            ></aSmart-estatica-tarjeta>
       
    
    
        <mat-card-actions>
            <b>Botones</b> (Opcionales)
            <div class="botonModel" *ngFor="let btn of botones; index as i">
                <button mat-raised-button
                color="primary">
                    {{btn.text}}
                </button>
                <button mat-icon-button (click)="delBoton(i)">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="botonForm">
                <mat-form-field>
                    <input matInput type="text" 
                    name="buttonText" id="buttonText"
                    [(ngModel)]="nuevoBoton.text"
                    placeholder="Texto"
                    >
                </mat-form-field>
                <mat-form-field>
                    <input matInput type="text" 
                    name="buttonLink" id="buttonLink"
                    [(ngModel)]="nuevoBoton.link"
                    placeholder="Link"
                    >
                </mat-form-field>
                <button mat-icon-button (click)="addBoton()">
                    <i class="fas fa-check"></i>
                </button>
            </div>

        </mat-card-actions>
        
</mat-dialog-content>

<mat-dialog-actions style="display: flex; justify-content: space-around;">
    <button 
    (click)="dialog.close()"
    mat-raised-button>
        Cerrar
    </button>
    
    <button 
    (click)="save()"
    color="primary"
    mat-raised-button>
        Guardar
    </button>
</mat-dialog-actions>
