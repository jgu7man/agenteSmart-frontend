<div class="container">
    <div class="row">
        
        <div class="col s1">
            <button mat-icon-button
            (click)="close.emit()">
                <i class="fas fa-times fa-lg"></i>
            </button>
        </div>
        
        <div class="col s9">
            <h5><b>{{coleccion.name}}</b></h5>
        </div>
        
        <div class="col s2">
            <button mat-raised-button
            color="warn"
            (click)="onDelete()">
                Eliminar
            </button>
        </div>
    </div>

    <!-- START Interfaz de colección -->
    <div class="row" id="data-table">
        
        <div class="col s12">
                
            <aSmart-guardado-coleccion
            [coleccion]="coleccion"
            ></aSmart-guardado-coleccion>

        </div>

    </div>
    <!-- END Interfaz de tabla -->

    


</div>
