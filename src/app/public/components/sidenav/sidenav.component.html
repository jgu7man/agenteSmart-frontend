<mat-accordion [displayMode]="'flat'">
    <mat-expansion-panel
        class="menu-section"
        *ngFor="let parent of Sidenav"
        gdev-color
        [background]="'dark'"
        [color]="'white'"
        [expanded]="onActive(parent.routeId)"
        [hideToggle]="true"
        >

        <mat-expansion-panel-header
            [ngClass]="{'amber-text':onActive(parent.routeId) }"
            [routerLink]="parent.route ? [parent.route] : []">
            <mat-panel-title *ngIf="!checkResponsive()" [color]="'bg1'" gdev-color> {{parent.name}} </mat-panel-title>
            <!-- <mat-panel-description> -->
                <i class="fas {{parent.icon}}" gdev-color [color]="'bg1'"></i>
            <!-- </mat-panel-description> -->
        </mat-expansion-panel-header>

        <div class="collection">
            <a *ngFor="let child of parent.childs"
            [routerLink]="[child.route]"
            routerLinkActive="active"
            class="collection-item"
            gdev-color
            [color]="'white'"
            [background]="'dark'"
            >{{child.name}}</a>
        </div>
    </mat-expansion-panel>

</mat-accordion>
