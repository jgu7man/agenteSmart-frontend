<mat-drawer-container [hasBackdrop]="true">
    <mat-drawer #currentClient [mode]="'over'" position="end">
        <aSmart-client-interaction
        *ngIf="clientSelected"
        [client]="clientSelected"
        (close)="onCloseClient()"
        ></aSmart-client-interaction>
    </mat-drawer>
    <mat-drawer-content strechHeight>
        <div class="container">

            <mat-card class="dashboard-section-card">
                <mat-card-header class="dashboard-section-header">
                    <mat-card-title class="dashboard-section-title">
                        <h2>Clientes</h2>
                    </mat-card-title>
                    <mat-card-subtitle>
                        Aquí podrás ver las interacciones que tus agentes han tenido
                    </mat-card-subtitle>
                </mat-card-header>
                <mat-card-content *ngIf="clientsList">

                    <ng-container *ngIf="clientsList.length > 0; else empty">
                        <mat-selection-list #listPanel class="drawer-list"
                        (selectionChange)="onClientSelected($event)"
                        [multiple]="false">
                            <mat-list-option
                            *ngFor="let client of clientsList"
                            [value]="client"
                            >
                            <div class="row align-cols">
                                <div class="col s1">
                                    <div class="profileImg">
                                        <img  [src]="client.photoURL ? client.photoURL : ''" >
                                    </div>
                                </div>
                                <div class="col s5">
                                    {{client.name ? client.name : client.userId}}
                                </div>

                                <div class="col s5">
                                    {{client.lastUpdated}}
                                </div>

                            </div>
                            </mat-list-option>
                        </mat-selection-list>
                    </ng-container>
                    <ng-template #empty>
                        <div class="row">
                            <div class="col s12 center">
                                <p class="center grey-text">Aún no tienes conversaciones </p>
                                <i class="fas fa-robot fa-10x grey-text "></i>
                            </div>
                        </div>
                    </ng-template>


                </mat-card-content>

            </mat-card>
        </div>
    </mat-drawer-content>
</mat-drawer-container>
