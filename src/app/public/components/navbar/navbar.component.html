<mat-toolbar
gdev-color
[background]="view == 'dashboard' ? 'dark' : 'bg2'"
id="navbar"
class="mat-elevation-z5">
    <button mat-icon-button class="hide-on-large-only mobile-menu" [mat-menu-trigger-for]="navbarMenu">
        <i class="fas fa-bars"></i>
    </button>
    <mat-menu #navbarMenu="matMenu">
        <a mat-menu-item [routerLink]="['/inicio']"
        routerLinkActive="active">Inicio</a>
        <a mat-menu-item [routerLink]="['/academia']"
        routerLinkActive="active">Academia</a>
        <a mat-menu-item [routerLink]="['/docs']"
        routerLinkActive="active">Documentación</a>
        <a mat-menu-item [routerLink]="['/precios' ]"
        routerLinkActive="active">Precios</a>

    </mat-menu>
    <!-- <span class="hide-on-large-only mobile-menu" (click)="dashboard.toggleMobileMenu.emit()"> <i class="fas fa-bars    "></i> </span> -->
    <span [routerLink]="['/inicio']" class="logo-area" >
        <div class="app-logo">
            <img src="/assets/icons/as-iso@0.5x.png" alt="Logo Agente Smart">
        </div>
        <p class="logo-text" gdev-color
        [color]="view == 'dashboard' ? 'bg2' : 'dark'"  >Agente Smart</p>
    </span>
    <span class="espacio"></span>

    <!-- MENU MOBILE -->
    <button mat-icon-button class="hide-on-large-only mobile-menu" [mat-menu-trigger-for]="navbarMenu">
        <i class="fas fa-bars white-text "></i>
    </button>
    <mat-menu #navbarMenu="matMenu">
        <a mat-menu-item [routerLink]="['/inicio']"
        routerLinkActive="active">Inicio</a>
        <a mat-menu-item [routerLink]="['/academia']"
        routerLinkActive="active">Academia</a>
        <a mat-menu-item [routerLink]="['/docs']"
        routerLinkActive="active">Documentación</a>
        <a mat-menu-item [routerLink]="['/precios' ]"
        routerLinkActive="active">Precios</a>

    </mat-menu>

    <!-- MENÚ DESKTOP -->
    <span class="nav_menu hide-on-med-and-down">
        <div class="main_menu">
            <a [routerLink]="['/inicio']"
            routerLinkActive="active">Inicio</a>
            <a [routerLink]="['/academia']"
            routerLinkActive="active">Academia</a>
            <a [routerLink]="['/docs']"
            routerLinkActive="active">Documentación</a>
            <a [routerLink]="['/precios' ]"
            routerLinkActive="active">Precios</a>
        </div>
    </span>


    <div class="col right user_log" *ngIf="user; else unlogged">
        <!-- <button mat-button
        [matMenuTriggerFor]="menuProfile"
        >Cuenta
            <i class="fas fa-chevron-circle-down"></i>
        </button> -->
        <!-- <a [matMenuTriggerFor]="menuProfile">Cuenta</a> -->
        <mat-menu #menuProfile="matMenu">
            <!-- <button mat-menu-item>Ver perfil</button> -->
            <button mat-menu-item [routerLink]="['/dashboard']">Dashboard</button>
            <button mat-menu-item (click)="auth.singOut()">Cerrar sesión</button>
        </mat-menu>

        <div class="imgProfileContainer"
        [matMenuTriggerFor]="menuProfile">
            <img src="{{user.photoURL}}" alt="">
        </div>

        <!-- <p class="userName" gdev-color [color]="view == 'dashboard' ? 'bg2' : 'dark'"> {{user.displayName}} </p> -->
    </div>
    <ng-template #unlogged>
        <aSmart-login-button (isLogged)="user = $event"></aSmart-login-button>
    </ng-template>
</mat-toolbar>
