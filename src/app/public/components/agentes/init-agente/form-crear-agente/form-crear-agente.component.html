<form action="#"
      method="post"
      onsubmit="return false">
  <div class="row">
    <div class="col s12">

    </div>

    <!-- Nombre -->
    <div class="col s12">
      <mat-form-field>
        <mat-label>Nombre</mat-label>
        <input name="nombre"
               id="nombre"
               matInput
               [(ngModel)]="agente.displayName">
      </mat-form-field>
    </div>

    <!-- select de lenguajes -->
    <div class="col s12 m6">
      <mat-form-field>
        <mat-label>Lenguaje</mat-label>
        <mat-select name="language"
                    id="language"
                    [(ngModel)]="agente.defaultLanguageCode">
          <mat-option *ngFor="let lenguaje of lenguajes"
                      [value]="lenguaje.code">
            {{lenguaje.name}}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <!-- Zona horaria -->
    <div class="col s12 m6">
      <mat-form-field>
        <mat-label>Zona horaria</mat-label>
        <mat-select name="timeZone"
                    id="timeZone"
                    [(ngModel)]="agente.timeZone">
          <mat-option *ngFor="let zona of zonasHorarias"
                      [value]="zona.value">
            {{zona.display}}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <!-- Descripción -->
    <div class="col s12">
      <mat-form-field>
        <mat-label>Descripción</mat-label>
        <textarea [(ngModel)]="agente.description"
                  matInput
                  name="descripcion"
                  id="descripcion"
                  cols="30"
                  rows="10"
                  placeholder="Opcional"></textarea>
      </mat-form-field>
    </div>


    <!-- Avatar -->
    <div class="col s12">
      <mat-form-field>
        <mat-label matTooltip="Imagen o logo de tu agente"
                   [matTooltipPosition]="'above'">Avatar</mat-label>
        <input [(ngModel)]="agente.avatarUri"
               name="avatar"
               id="avatar"
               matInput
               placeholder="https://...">
      </mat-form-field>
    </div>




  </div>

  <div class="row">
    <div class="col s12 center">
      <button mat-raised-button
              color="accent" (click)="onSubmit()">Crear</button>
    </div>
  </div>

</form>
