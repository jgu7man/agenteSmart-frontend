<mat-drawer-container
[hasBackdrop]="false"
>
    <mat-drawer class="mensajes-list-container" 
    autosize 
    [opened]="true"
    mode="side"
    gdev-color [background]="'bg3'"
    >
        <aSmart-mensajes-list></aSmart-mensajes-list>
    </mat-drawer>

    <mat-drawer-content gdev-color [background]="'bg1'">
        <div class="context-containers">
            <aSmart-contextos></aSmart-contextos>
        </div>
    </mat-drawer-content>
</mat-drawer-container>
