<p id="breadcums" *ngIf="contexto">
    <!-- CONTEXTO -->
    <a [routerLink]="['../../mensajes']"  ><span><b>{{contexto}}: </b></span></a>
    <!-- ENTRADAS -->
    <span *ngFor="let mensaje of mensajes | slice:0:intentIndex +1; index as i">
        <a [routerLink]="['../../mensaje',mensaje.name]"
        [queryParams]="{'contexto': contexto}">
        {{mensaje.displayName}}
    </a> 
    <span *ngIf="i != mensajes.length -1"> > </span>
</span>
</p>
