<div class="container">
    <div class="row aling-cols">
        <div class="col s10">
            <h5>Respuestas</h5>
        </div>
        <div class="col s2">
            <button mat-icon-button (click)="addRespuesta()">
                <i class="fas fa-plus"></i>
            </button>
        </div>
    </div>


    <div class="row respuestasList" *ngIf="(mensaje_.respuestasList$ | async) as respuestas">
      <ng-container *ngIf="respuestas.length; else sinRespuestas">

        <div class="respuestaItem"
        *ngFor="let respuesta of respuestas">
            <aSmart-respuesta-card
            [respuesta]="respuesta"
            (onDelete)="deleteRespuesta(respuesta.id, respuesta.index)"
            ></aSmart-respuesta-card>
        </div>
      </ng-container>
      <ng-template #sinRespuestas>
        <div class="col s12 center">
            Aún no has agregado respuestas
        </div>
      </ng-template>
    </div>

</div>
