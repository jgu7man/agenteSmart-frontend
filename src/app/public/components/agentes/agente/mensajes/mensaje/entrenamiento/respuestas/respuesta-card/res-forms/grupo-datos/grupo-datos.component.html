<!-- Parámetro -->
<div class="row">
    <div class="col s4 resp-label">
        Parámetro
    </div>
    <div class="col s8">
        <mat-select placeholder="parámetro" [(ngModel)]="dataForm.parametro" name="param"
        (selectionChange)="edited.emit(dataForm)">
            <mat-option *ngFor="let param of mensaje_.current.parameters" [value]="param.displayName">
                {{param.displayName}}
            </mat-option>
        </mat-select>
    </div>
</div>


<!-- Grupo de datos -->
<div class="row">
    <div class="col s4 resp-label">
        En colección
    </div>
    <div class="col s8">
        <mat-select placeholder="coleccion" [(ngModel)]="dataForm.grupoDatos" name="grupo" (selectionChange)="edited.emit(dataForm)"
        (click)="validateColeccionOnClick()">
            <mat-option *ngFor="let group of colecciones | listFilter:{tipo: 'guardado'}" [value]="group.name">
                {{group.name}}
            </mat-option>
        </mat-select>
    </div>
</div>


<!-- Key to catch -->
<div class="row">
    <div class="col s4 resp-label">
        es:
    </div>
    <div class="col s8">
        <mat-select placeholder="Dato esperado" [(ngModel)]="dataForm.key" name="key" (selectionChange)="edited.emit(dataForm)">
            <mat-option *ngFor="let item of KeySpected" [value]="item.param">
                {{item.param}}
            </mat-option>
        </mat-select>
    </div>
</div>
