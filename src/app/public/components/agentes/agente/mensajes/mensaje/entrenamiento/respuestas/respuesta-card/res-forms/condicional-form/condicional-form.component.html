<!-- Parámetro -->
<div class="row">
    <div class="col s4 resp-label">
        Si
    </div>
    <div class="col s8">
        <mat-select placeholder="parámetro" [(ngModel)]="condicional.parametro" name="param"
        (selectionChange)="onParamChange()">
            <mat-option *ngFor="let param of resService.paramList" [value]="param.displayName">
                {{param.displayName}}
            </mat-option>
        </mat-select>
    </div>
</div>

<!-- Condición -->
<div class="row">
    <div class="col s4 resp-label">
        es
    </div>
    <div class="col s8">
        <mat-select placeholder="condición" [(ngModel)]="condicional.condicion" name="condition"
        (selectionChange)="onRespChanges.emit(condicional)">
            <mat-option *ngFor="let condition of condicionesList" [value]="condition.displayText">
                {{condition.displayText}}
            </mat-option>
        </mat-select>
    </div>
</div>


<!-- Valor -->
<div class="row">
    <div class="col s4 resp-label">
        Valor
    </div>
    <div class="col s8">
        <ng-container *ngIf="!isOriginal; else original">
            <mat-select placeholder="Valor" [(ngModel)]="condicional.valor" name="valor"
            (selectionChange)="onRespChanges.emit(condicional)">
                <mat-option *ngFor="let valor of tipoSelected.entities" [value]="valor.value">
                    {{valor.value}}
                </mat-option>
            </mat-select>
        </ng-container>
        <ng-template #original>
            <mat-form-field>
                <input 
                class="resp-input"
                matInput
                type="text" 
                name="conditionValue" 
                id="conditionValue"
                [(ngModel)]="condicional.valor"
                >
            </mat-form-field>
        </ng-template>
    </div>
</div>
