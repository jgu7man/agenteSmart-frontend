<div class="row">
    <div class="col s12">
        <mat-form-field>
            <input type="text" name="titulo" id="titulo"
            matInput [(ngModel)]="card.titulo"
            >
        </mat-form-field>
    </div>
    <div class="col s12">
        <mat-form-field>
            <textarea matInput class="resp-input" name="mensaje"  id="mensaje" 
            cols="30" rows="5" [(ngModel)]="card.body"
            ></textarea>
        </mat-form-field>
    </div>
</div>
