<div class="row">
    <div class="col s12">
        <mat-form-field>
            <textarea matInput class="resp-input" name="mensaje"  id="mensaje" 
            cols="30" rows="5" [(ngModel)]="suggests.respuesta"
            ></textarea>
        </mat-form-field>
    </div>
</div>
    
<div class="row">
    <div class="col s12">
        <mat-form-field class="example-chip-list">
          <mat-chip-list #chipList aria-label="Sugerencias">
            <mat-chip *ngFor="let sugerencia of sugerencias" [selectable]="true"
            color="primary" [removable]="true" (removed)="remove(sugerencia)">
              {{sugerencia}}
              <mat-icon matChipRemove>cancel</mat-icon>
            </mat-chip>
            <input placeholder="Sugerencias"
                   [matChipInputFor]="chipList"
                   [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
                   (matChipInputTokenEnd)="add($event)">
          </mat-chip-list>
        </mat-form-field>
    </div>
</div>
