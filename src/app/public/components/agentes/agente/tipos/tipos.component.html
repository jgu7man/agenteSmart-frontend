<div id="tipos-container" class="container">
    <div class="row">
        <div class="col s12">
            <mat-accordion>
                <aSmart-tipo 
                *ngFor="let tipo of agente.tiposList" 
                [tipo]="tipo"
                (tipoDeleted)="onDeleted($event)"
                ></aSmart-tipo>
                <aSmart-add-tipo></aSmart-add-tipo>
            </mat-accordion>
        </div>
    </div>
</div>
