<mat-expansion-panel #tipoPanel (afterCollapse)="onExpanded()" (afterExpand)="onExpanded()" >
    <mat-expansion-panel-header>
        <ng-container *ngIf="!switchEditTipo; else editTipoInput">
            @{{tipo.displayName}}
        </ng-container>

        <!-- UPDATE tipo name -->
        <ng-template #editTipoInput>
            <mat-form-field>
                <input 
                matInput
                type="text" 
                #editInput
                name="editInput" 
                id="editInput"
                [(ngModel)]="tiposService.currentTipo(tipo.name).displayName"
                (keydown)="delSpaces($event)"
                >
            </mat-form-field>                            
        </ng-template>
    </mat-expansion-panel-header>
    
    <div class="row">
        <div class="col s12 m10">
            <aSmart-tipo-body [tipo]="tipo" (edited)="tipo = $event"></aSmart-tipo-body>
        </div>
        <div class="col s12 m2">
            
            <button 
            mat-raised-button 
            [color]="'primary'" 
            (click)="tiposService.setTipo(tipo)"
            >Guardar</button>

            <button 
            mat-raised-button 
            [color]="'warn'" 
            (click)="tiposService.deleteTipo( tipo.name )"
            >Eliminar</button>

        </div>
    </div>
    <!-- Tipo body to update -->
    
    <div class="row space-around">
        
        
    </div>
</mat-expansion-panel>
