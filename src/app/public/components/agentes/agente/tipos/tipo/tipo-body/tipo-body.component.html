<div id="tipo-body" *ngIf="tipo">
  <!-- ## OPCIONES DE ENTIDAD -->
  <div class="row">
    <div class="col s12" id="tipo-options">
      <mat-checkbox
        [color]="'primary'"
        (change)="onKindChange($event)"
        [checked]="tipo.kind == 'KIND_MAP'"
      >
        Activar sinónimos
      </mat-checkbox>

      <mat-checkbox
        [color]="'primary'"
        (change)="onExpantionChange($event)"
        [checked]="tipo.autoExpansionMode == 'AUTO_EXPANSION_MODE_DEFAULT'"
      >
        Auto expansión
      </mat-checkbox>

      <mat-checkbox
        [color]="'primary'"
        (change)="onFuzzyChange($event)"
        [checked]="tipo.enableFuzzyExtraction"
      >
        Activar coincidencia parcial
      </mat-checkbox>
    </div>
  </div>

  <!-- !## OPCIONES DE ENTIDAD -->

  <!-- ## INICIA CLASES CRUD -->
  <div class="row">
    <div class="col s12">
      <h6>Clases del tipo de dato</h6>

      <!-- ## Clases con sinónimos -->
      <mat-card >
        <mat-card-content>
          <!-- Table head -->
          <div class="row">
            <div class="col s3">Clase</div>
            <div class="col s9"
            *ngIf="tipo.kind == 'KIND_MAP'"
            >Sinónimos</div>
          </div>


          <!-- READ lista CLASES DE TIPO -->
          <ul class="clase-list collection">
            <li
              class="clase-item collection-item"
              *ngFor="let clase of tipo.entities"
            >
            <!-- UPDATE CLASE  -->
              <div class="row">
                <aSmart-clase-item
                  (claseEdited)="toEditClase($event)"
                  [claseId]="clase.value"
                  [kind]="tipo.kind"
                ></aSmart-clase-item>
              </div>
            </li>

            <!-- CREATE CLASE DE TIPO -->
            <ng-template #addClase>
              <li
                class="clase-item collection-item"
                [ngClass]="{ 'collection-item': switchAddClase }"
              >
                <div class="row">
                  <aSmart-clase-item
                    (claseEdit)="toEditClase($event)"
                    [ClaseInput]="true"
                    [kind]="tipo.kind"
                  ></aSmart-clase-item>
                </div>
              </li>
            </ng-template>
          </ul>
          <!-- TO CREATE -->
          <ng-container *ngIf="!switchAddClase; else addClase">
            <button
              mat-button
              (click)="switchAddClase = true"
              [disabled]="!tipo.name"
            >
              Agregar nueva clase
            </button>
          </ng-container>
        </mat-card-content>
      </mat-card>
      <!-- !## Clases con sinónimos -->


    </div>
  </div>
  <!-- !## CLASES CRUD -->
</div>
