<mat-form-field>
    <input
    matInput
    #partEntityInput
    type="text"
    [formControl]="tipoControl"
    [matAutocomplete]="auto"
    [value]="value"
    (blur)="onTipoSelected($event)"
    >
    <mat-autocomplete #auto="matAutocomplete"
    placeholder="Selecciona uno" showPanel="false"
    [panelWidth]="300"
    (optionSelected)="onTipoSelected($event)">
        <mat-option *ngFor="let tipo of tiposFiltered | async" [value]="tipo">
            @{{tipo}}
        </mat-option>
    </mat-autocomplete>
</mat-form-field>
