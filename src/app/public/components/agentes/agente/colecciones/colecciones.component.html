<mat-drawer-container [hasBackdrop]="false">
    <mat-drawer #currentCol [mode]="'over'" position="end">
        <aSmart-coleccion 
        [coleccion]="coleccionSelected"
        (close)="onCloseColeccion()"
        ></aSmart-coleccion>
    </mat-drawer>
    <mat-drawer-content>
        <div class="container">
            <div class="row align-cols">
                <div class="col s10">
                    <b>Colecciones</b>
                    <button mat-icon-button (click)="openAddDialog()">
                        <i class="fas fa-plus fa-lg"></i>
                    </button>
                </div>
            </div>
            <div class="row">
                <div class="col s12">
                    <mat-selection-list #listPanel
                    (selectionChange)="onCollectionSelected($event)" 
                    [multiple]="false">
                        <mat-list-option 
                        *ngFor="let coleccion of agente.coleccionesList"
                        [value]="coleccion"
                        >
                            {{coleccion.name}}
                        </mat-list-option>
                    </mat-selection-list>
                </div>
            </div>
        </div>
    </mat-drawer-content>
</mat-drawer-container>
