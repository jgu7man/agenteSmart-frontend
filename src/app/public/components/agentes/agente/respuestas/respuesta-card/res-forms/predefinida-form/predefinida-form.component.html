<div class="row">
    <div class="col s4 resp-label">
        Respuesta
    </div>
    <div class="col s8">
        <mat-form-field>
            <textarea 
            class="resp-input"
            matInput
            name="mensaje" 
            id="mensaje" 
            cols="30" 
            rows="5"></textarea>
        </mat-form-field>
    </div>
</div>
<div class="row">
    <div class="col s4 resp-label">
        Acción
    </div>
    <div class="col s8 right">
        <mat-slide-toggle [(ngModel)]="activateAccion">Realizar accion</mat-slide-toggle>
    </div>
</div>
        <ng-container *ngIf="activateAccion">
            <div class="row">
                <div class="col s4">
                    <mat-select 
                    placeholder="Acción" 
                    [(ngModel)]="accion" 
                    name="contexto">
                        <mat-option *ngFor="let action of resService.acciones" [value]="action">
                            {{action.accion}}
                        </mat-option>
                    </mat-select>
                </div>
                <div class="col s8">
                    <mat-form-field>
                        <input matInput placeholder="Ruta" class="resp-input">
                    </mat-form-field>
                </div>
            </div>
        </ng-container>

<div class="row">
    <div class="col s4 resp-label">
        Contexto
    </div>
    <div class="col s8">
        <mat-select 
        *ngIf="resService.contextList"
        placeholder="Siguiente contexto" 
        [(ngModel)]="siguienteContexto" 
        name="contexto">
            <mat-option *ngFor="let contexto of resService.contextList" [value]="contexto.contextName">
                {{contexto.contextName}}
            </mat-option>
        </mat-select>
    </div>
</div>
<div class="row">
    <div class="col s4 resp-label">
        Siguiente
    </div>
    <div class="col s8">
        <mat-select 
        *ngIf="resService.mensajesList"
        placeholder="Siguiente mensaje" 
        [(ngModel)]="siguienteMensaje" 
        name="mensaje">
            <mat-option *ngFor="let mensaje of resService.mensajesList" [value]="mensaje.name">
                {{mensaje.displayName}}
            </mat-option>
        </mat-select>
    </div>
</div>
