<!-- Lista de entradas -->
<div class="entradas-list">
    <mat-card *ngFor="let entrada of entradas; trackBy:trackByName">
        <mat-card-content class="entrada-card">
            <p class="entrada-name"> {{entrada.displayName}} </p>
        </mat-card-content>
    </mat-card>
</div>


<!-- Agregado de entrada nueva -->
<div class="row">
    <div class="add-intent" [ngClass]="{'activate': switchAddIntent}" *ngIf="!switchAddIntent; else addIntent" (click)="onAddIntent()">
        <i class="fas fa-plus"></i>
    </div>
    <ng-template #addIntent>
        <mat-card>
            <mat-card-content>
                <mat-form-field>
                    <input matInput 
                    type="text" 
                    name="intentName" 
                    id="intentName"
                    #intentNuevo
                    (keyup.enter)="onSetIntent(contexto)"
                    (blur)="newIntent == '' ? switchAddIntent = false : onSetIntent(contexto)"
                    [(ngModel)]="newIntent"
                    >
                </mat-form-field>
            </mat-card-content>
        </mat-card>
        <!-- <div class="intent"></div> -->
    </ng-template>
</div>
