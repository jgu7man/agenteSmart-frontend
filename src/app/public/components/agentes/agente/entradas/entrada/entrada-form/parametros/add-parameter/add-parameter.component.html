<div class="row">
    <div class="col s3">
        <mat-form-field>
            <input matInput 
            type="text" 
            #displayName
            name="displayName" 
            id="displayName"
            [(ngModel)]="param.displayName"
            >
        </mat-form-field>
    </div>

    <div class="col s3">
        <aSmart-tipo-selector 
        [value]="param.entityTypeDisplayName"
        (tipoSelected)="onTipoChanged($event)"
        ></aSmart-tipo-selector>
    </div>

    <div class="col s3">
        <aSmart-param-value 
        [paramValue]="param.displayName"
        (paramValueSelected)="onValueSelected($event)"
        ></aSmart-param-value>
    </div>

    <div class="col s1">
        <mat-checkbox 
        [(ngModel)]="param.mandatory"
        ></mat-checkbox>
    </div>

    <div class="col s1">
        <mat-checkbox
        [(ngModel)]="param.isList"
        ></mat-checkbox>
    </div>

    <div class="col s1">
        <button mat-icon-button (click)="paramsService.addParam(param); closeRow.emit(true)">
            <i class="fas fa-check green-text"></i>
        </button>
        <button mat-icon-button (click)="closeRow.emit(true)">
            <i class="fas fa-times red-text"></i>
        </button>
        
    </div>
</div>
