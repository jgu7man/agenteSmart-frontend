<p id="breadcums">
    <!-- CONTEXTO -->
    <a [routerLink]="['../../entradas']"  ><span><b>{{contexto}}: </b></span></a>
    <!-- ENTRADAS -->
    <span *ngFor="let entrada of entradas | slice:0:intentIndex +1; index as i">
        <a [routerLink]="['../../entrada',entrada.name]"
        [queryParams]="{'contexto': contexto}">
        {{entrada.displayName}}
    </a> 
    <span *ngIf="i != entradas.length -1"> > </span>
</span>
</p>
