<div class="part-parameter-form" *ngIf="parte" >
    <div class="row" *ngIf="parte.entityType || parte.selected">
        <div class="col s4">
            <mat-form-field>
                <input 
                matInput 
                type="text" 
                name="param-name" 
                id="param-name"
                [(ngModel)]="paramName"
                >
            </mat-form-field>
        </div>
        <div class="col s4">
            <mat-form-field>
                <input matInput
                type="text" 
                name="part-entity" 
                id="part-entity-{{parteIndex}}"
                [formControl]="entityControl"
                [matAutocomplete]="auto"
                >
                <mat-autocomplete #auto="matAutocomplete">
                    <mat-option *ngFor="let tipo of tiposFiltered | async" [value]="tipo">
                        {{tipo}}
                    </mat-option>
                </mat-autocomplete>
            </mat-form-field>
        </div>
        <div class="col s4">
            {{parte.text}}
        </div>
    </div>
</div>
