<div class="row">
    <div class="col s4 resp-label">
        Respuesta
    </div>
    <div class="col s8">
        <mat-form-field>
            <textarea 
            class="resp-input"
            matInput
            name="mensaje" 
            id="mensaje" 
            cols="30" 
            rows="5"></textarea>
        </mat-form-field>
    </div>
</div>
<div class="row">
    <div class="col s4 resp-label">
        Contexto
    </div>
    <div class="col s8">
        <mat-select 
        *ngIf="resService.contextList"
        placeholder="Siguiente contexto" 
        [(ngModel)]="siguienteContexto" 
        name="contexto">
            <mat-option *ngFor="let contexto of resService.contextList" [value]="contexto.contextName">
                {{contexto.contextName}}
            </mat-option>
        </mat-select>
    </div>
</div>
<div class="row">
    <div class="col s4 resp-label">
        Siguiente
    </div>
    <div class="col s8">
        <mat-select 
        *ngIf="resService.entradasList"
        placeholder="Siguiente entrada" 
        [(ngModel)]="siguienteEntrada" 
        name="entrada">
            <mat-option *ngFor="let entrada of resService.entradasList" [value]="entrada.name">
                {{entrada.displayName}}
            </mat-option>
        </mat-select>
    </div>
</div>
