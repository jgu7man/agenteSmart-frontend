<div mat-dialog-content>
    <p class="center">¿Realemente deseas eliminar esta entrada?</p>
</div>
<mat-dialog-actions style="display: flex; justify-content: space-around;">
    <button 
    mat-raised-button 
    (click)="dialog.close()"
    >Cancelar</button>
    <button 
    mat-raised-button 
    (click)="entradas.deleteEntrada(entradaName)" 
    [mat-dialog-close]="true"
    >Aceptar</button>
</mat-dialog-actions>
