<mat-card-title>
    <gdev-reactive-textline
    [label]="'Titulo'"
    [text]="contenido.titulo"
    (onTextEvent)="contenido.titulo = $event"
    ></gdev-reactive-textline>
</mat-card-title>

<gdev-file-uploader
[folder]="user.uid+'/tarjetas/'"
displayAction="Agregar Imagen"
[srcPreview]="contenido.imagenURL['url']"
(imageURL)="catchImgURL($event)"
></gdev-file-uploader>

<mat-card-content>
    <gdev-reacvtive-dialogbox
    [label]="'body'"
    [text]="contenido.body"
    (onTextEvent)="contenido.body = $event"
    ></gdev-reacvtive-dialogbox>
</mat-card-content>
