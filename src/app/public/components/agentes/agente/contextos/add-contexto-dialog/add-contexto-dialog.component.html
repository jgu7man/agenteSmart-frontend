<p mat-dialog-title>Crea un nuevo contexto</p>
<mat-dialog-content>
    <div class="row">
        <div class="col s12">
            <mat-form-field>
                <mat-label>Nombre del contexto</mat-label>
                <input
                matInput
                type="text"
                [(ngModel)]="nuevoContexto.contextName"
                name="contextName"
                >
            </mat-form-field>
        </div>
    </div>
</mat-dialog-content>
<mat-dialog-actions
style="display: flex; justify-content: space-around;">
    <button mat-raised-button
    (click)="dialog_.close()"
    >Cancel</button>
    <button mat-raised-button
    (click)="onSave()"
    color="primary"
    >Crear</button>
</mat-dialog-actions>
