<div class="container">
    <div class="row">
        <div class="col s12 l6 agente-box" *ngFor="let agente of agentes">
            <mat-card>
                <mat-card-header> 
                    <div mat-card-avatar 
                    class="avatar-img" 
                    [ngStyle]="{'background-image':'url('+agente.avatarUri+')'}" 
                    [routerLink]="['/dashboard/agente/', agente.projectId]"
                    alt=""></div>
                    <mat-card-title [routerLink]="['/dashboard/agente/', agente.projectId]"
                    >{{agente.displayName}} </mat-card-title>
                    <mat-card-subtitle> {{agente.description}} </mat-card-subtitle>
                    <button class="card-menu" mat-button [matMenuTriggerFor]="menu">
                        <i class="fas fa-ellipsis-v"></i>
                    </button>
                    <mat-menu #menu="matMenu">
                        <button mat-menu-item>Editar</button>
                        <button mat-menu-item>Eliminar</button>
                    </mat-menu>
                </mat-card-header>
            </mat-card>
        </div>
    </div>
</div>
