<div class="container">
    <div class="row" *ngIf="_agentes.agentes$ | async; else noAgentes">

        <!-- Si hay agentes -->
        <div class="col s12 l6 agente-box" *ngFor="let agente of _agentes.agentes$ | async" >
            <mat-card>
                <mat-card-header> 
                    <!-- Icono del agente -->
                    <div mat-card-avatar 
                    class="avatar-img" 
                    [ngStyle]="{'background-image':'url('+agente.avatarUri.url+')'}" 
                    [routerLink]="['/dashboard/agente/', agente.projectId]"
                    alt="">
                    </div>

                    <!-- Nombre del agentes -->
                    <mat-card-title [routerLink]="['/dashboard/agente/', agente.projectId]"
                    >{{agente.displayName}} </mat-card-title>

                    <!-- Descripción -->
                    <mat-card-subtitle> {{agente.description}} </mat-card-subtitle>

                    <!-- Opciones -->
                    <button class="card-menu" mat-button [matMenuTriggerFor]="menu">
                        <i class="fas fa-ellipsis-v"></i>
                    </button>
                    <mat-menu #menu="matMenu">
                        <button mat-menu-item
                        [routerLink]="['/dashboard/editar_agente', agente.projectId]"
                        >Editar</button>
                        <button mat-menu-item>Eliminar</button>
                    </mat-menu>

                </mat-card-header>
            </mat-card>
        </div>
        
    </div>
    
    <!-- Si no hay agentes -->
    <ng-template #noAgentes>
        <div class="col s12 center">
            <p class="center grey-text">Aún no tienes agentes creados.</p>
            <i class="fas fa-robot fa-10x grey-text "></i>
        </div>
    </ng-template>

</div>
