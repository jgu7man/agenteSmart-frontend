<div *ngIf="_auth.user$ | async; else login">
    <button mat-raised-button (click)="_auth.singOut()">Cerrar Sesión</button>
</div>
<ng-template #login>
    <button mat-raised-button (click)="openDialog()">Ingresar</button>
    <button mat-raised-button (click)="createAgent()">Crear Agente</button>

</ng-template>
