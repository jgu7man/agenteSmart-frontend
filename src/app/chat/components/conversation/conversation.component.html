<div id="messages-container" #messagesContainer>
    <div class="message"
    [ngClass]="{'this': msg.emiter == 'this', 'that': msg.emiter == 'that'}"
    *ngFor="let msg of messages">
     <div [ngSwitch]="messageType(msg.message)">
         <div *ngSwitchCase="'image'">
            <div class="globe">
                <span class="message-date">{{formatDate(msg.time)}}</span>
            </div>
         </div>

         <div class="sugerencias" *ngSwitchCase="'quickresponse'">
             <span *ngFor="let item of msg.message" class="suggest"
             (click)="onSuggest(item)">
                 {{item['displayText']}}
             </span>
         </div>

         <div *ngSwitchDefault>
             <p class="globe" >{{msg.message}}</p>
             <span class="message-date">{{formatDate(msg.time)}}</span>
         </div>
     </div>
    </div>
</div>
